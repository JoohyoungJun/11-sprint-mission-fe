<!DOCTYPE html>

    <header>

    <content>

          <div class="main-top-box-left">
            <h2 class="main-top-box-left-text">
              일상의 모든 물건을
              <br />
              거래해 보세요

      <div class="section">
        <div class="section-box">
          <img class="img-sec1" src="./imgs/Img_home_01.png" alt="img01.png" />

              <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-box">
          <div class="text-sec-left">
            <p class="text-blue">Search</p>
            <h1 class="sec-h1">
              구매를 원하는
              <br />
              상품을 검색하세요
            </h1>
            <p class="text-black">
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>
          <img class="img-sec2" src="./imgs/Img_home_02.png" alt="img02.png" />
        </div>
        <div class="section-box"></div>
      </div>
      <div class="section">
        <div class="section-box">
          <img class="img-sec3" src="./imgs/Img_home_03.png" alt="img03.png" />
          <div class="text-sec-rightside">
            <p class="text-blue">Register</p>
            <h1 class="sec-h1">
              판매를 원하는
              <br />
              상품을 등록하세요
            </h1>
            <p class="text-black">
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </div>
      <div class="main-bottom">
        <div class="main-bottom-box">
          <h2 class="main-bottom-box-left-text">
            믿을 수 있는
            <br />
            판다마켓 중고 거래
